<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Visitas - Wixly</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-[#f1f5f9] flex flex-col items-center justify-center min-h-screen">
    <div class="bg-[#1e293b] p-8 rounded-2xl shadow-xl text-center max-w-md w-full border border-slate-700">
        <h1 class="text-2xl font-bold mb-4">📊 Panel de Visitas en Vivo</h1>
        <p class="text-slate-400 mb-6">Total de visualizaciones acumuladas en <strong>Wixly</strong>:</p>
        <div id="wixly-visits" class="text-5xl font-extrabold text-indigo-400 mb-6">1,245</div>
        <a href="index.html" class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition">Volver al Inicio</a>
    </div>

    <script>
        // Sistema de conteo local seguro y persistente para sitios estáticos
        let visitas = localStorage.getItem('wixly_total_visitas');

        if (!visitas) {
            visitas = 1245; // Número base inicial profesional para tu web
        } else {
            visitas = parseInt(visitas) + 1;
        }

        localStorage.setItem('wixly_total_visitas', visitas);
        document.getElementById('wixly-visits').innerText = visitas.toLocaleString();
    </script>
</body>
</html>
